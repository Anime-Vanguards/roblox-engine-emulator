# Public releases publish a mirrored tag. Main and manual runs (dry runs) build and smoke-test every platform and only
# upload workflow artifacts. A nightly run does the same at main's head, unless nothing that ships changed since the
# newest commit of main with a passing run that kept its zips: the head itself, or an older commit when only docs,
# tests, CI or tools changed since (tools/release/README.md says which paths ship). Then it builds and uploads nothing,
# and its summary names that run.
#
# A tag publishes the zips of the dry run that passed on main at the tagged commit when there is one
# (tools/release/dry-run.mjs; the release command tags only such a commit), so the same source is not built twice;
# otherwise the tag run builds and smoke-tests every platform itself first.
#
# canary is a tag moved by the export to the newest commit of main with a passing run of this workflow. Its run
# publishes that run's zips as the prerelease "canary", a build of main between releases that is never marked latest,
# under asset names that stay the same from one build to the next. It never builds: without a passing run whose zips
# are still kept, it fails.
#
# Jobs: version (checks the tag), build and smoke (once per platform), notes, then publish (a version tag) or canary
# (the canary tag), which alone may write. The scripts are in tools/release/ (README.md there).
#
# Build cache: dry runs on main that do not change Cargo.toml's package version reuse compiled dependencies and
# sccache objects from earlier main runs (pruning ree's own crate before saving so ree always compiles from current
# source). Only runs on main write caches, keyed by runner image and compilers; pull requests, version-bump release
# commits ("Release vX.Y.Z"), and v* tag fallback builds start clean with no cache. vars.RELEASE_BUILD_CACHE=off or
# workflow_dispatch clean-build=true also forces a clean build.
name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'canary']
    # Applies to branch pushes only. Tags always run.
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release/**'
      - 'tools/ci/compile-cache.mjs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - '.cargo/config.toml'
      - 'tools/vendor.mjs'
      - 'tools/download.mjs'
      - 'patches/**'
      - 'src/**'
      - 'vendor/**'
      - 'data/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
  # Scheduled sweep every 2 hours at main's head (skips in seconds when nothing shipped)
  schedule:
    - cron: "31 */2 * * *"
  workflow_dispatch:
    inputs:
      clean-build:
        description: Build every crate from nothing, without the build cache
        type: boolean
        default: false

permissions:
  contents: read

# No release run is ever cancelled by another. Pushes to main share one group without cancelling: a dry run that has
# started always finishes (the release command may be waiting on it), and a newer push only replaces a dry run still
# waiting for it. Nightly runs share a group of their own, so they never replace a push's dry run, and canary tag runs
# share one, in which a newer canary only replaces a run still waiting. A version tag or a manual run is a group of its
# own.
concurrency:
  group: release-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'push' && github.ref == 'refs/tags/canary' && 'canary' || github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read # to find the dry run of the tagged commit, or for the nightly run the newest on main
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The dry run whose zips a tag publishes; empty when this run builds them
      dry-run: ${{ steps.dry-run.outputs.run-id }}
      # When that run started, for the canary's notes
      dry-run-date: ${{ steps.dry-run.outputs.run-date }}
      # false when a nightly run has nothing to build; empty on every other run
      nightly-build: ${{ steps.nightly.outputs.build }}
      # true when Cargo.toml's package version changed vs HEAD^ (a version-bump release commit); disables build caches
      # so versioned v* releases always publish clean cacheless binaries
      release-commit: ${{ steps.build-cache.outputs.release-commit }}
      # What the dependencies are compiled from, without workspace crate versions (tools/release/build-cache.mjs)
      build-cache: ${{ steps.build-cache.outputs.key }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The manifests and Cargo.lock must agree. A tag must be exactly v<version>, or canary, and on main.
      - name: Read the version and check the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" = canary ]; then
              version=$(node tools/release/version.mjs)
            else
              version=$(node tools/release/version.mjs --tag "$GITHUB_REF_NAME")
            fi
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          else
            version=$(node tools/release/version.mjs)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Key the build cache and detect release version bumps
        id: build-cache
        shell: bash
        run: |
          set -euo pipefail
          key=$(node tools/release/build-cache.mjs Cargo.toml profile-view/Cargo.toml tests/host/Cargo.toml tests/planted/Cargo.toml Cargo.lock .cargo/config.toml)
          release_commit=$(node tools/release/build-cache.mjs --is-release-commit)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "release-commit=$release_commit" >> "$GITHUB_OUTPUT"
      # A tag publishes the zips the passing dry run of the same commit built and smoke-tested on every platform; build
      # and smoke below then have nothing to do. Without one they run for a version tag, while the canary tag fails here
      # (--required), so it never builds.
      - name: Find a passing dry run of this commit
        id: dry-run
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/tags/canary' && '--required' || '' }}
        # $REQUIRED is unquoted so that, empty, it adds no argument
        run: node tools/release/dry-run.mjs --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --artifacts ree-windows-x86_64,ree-linux-x86_64,ree-macos-aarch64 $REQUIRED >> "$GITHUB_OUTPUT"
      # A nightly run builds main's head unless nothing that ships changed since the newest commit of main with a passing
      # run that kept its zips (tools/release/nightly.mjs). Then build and smoke below have nothing to do, and the run
      # uploads nothing.
      - name: Decide whether the nightly run builds
        id: nightly
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/nightly.mjs --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --artifacts ree-windows-x86_64,ree-linux-x86_64,ree-macos-aarch64 >> "$GITHUB_OUTPUT"
      - name: Say what the nightly run builds and why
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          REASON: ${{ steps.nightly.outputs.reason }}
        run: printf '%s\n' "$REASON" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    if: ${{ !github.event.repository.private && needs.version.outputs.dry-run == '' && needs.version.outputs.nightly-build != 'false' }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, os: windows, arch: x86_64, target: x86_64-pc-windows-msvc, binary: ree.exe }
          - { runner: ubuntu-22.04, os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu, binary: ree }
          - { runner: macos-15, os: macos, arch: aarch64, target: aarch64-apple-darwin, binary: ree }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      # One executable also on a Windows machine without the Visual C++ redistributable.
      RUSTFLAGS: ${{ matrix.os == 'windows' && '-C target-feature=+crt-static' || '' }}
      # Mimalloc's TLS hook precedes static CRT initialization; its CRT/FLS path starts after it.
      # Spelled -D, not /D: the build step runs in Git Bash, which rewrites an environment value that starts with / into
      # a Windows path, so cl.exe never saw the define. MSVC accepts both spellings.
      CXXFLAGS_x86_64_pc_windows_msvc: ${{ matrix.os == 'windows' && '-DMI_WIN_INIT_USE_FLS=1' || '' }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.90.0, the version ci.yml builds with
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: "1.90.0"
      - name: Restore the vendored archives cache
        id: vendor-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: vendor-archives-v1-${{ runner.os }}-${{ hashFiles('patches/luau/upstream.json', 'tools/vendor.mjs') }}
          path: &vendor-cache-path .cache/vendor
      - name: Vendored VM matches its patches
        id: vendor-check
        run: node tools/vendor.mjs --check
      - name: Store the vendored archives cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.vendor-cache.outcome == 'success' && steps.vendor-cache.outputs.cache-hit != 'true' && steps.vendor-check.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}
          path: *vendor-cache-path
      - name: Release script tests
        run: node --test tools/release/test.mjs
      # Main-only build cache for non-release dry runs (canaries). Never runs on PRs, version-bump release commits
      # ("Release vX.Y.Z"), or v* tag fallback builds; vars.RELEASE_BUILD_CACHE=off or clean-build disables it too.
      # Runner image and compiler versions enter the cache keys so no build mixes toolchains across images.
      - name: Name the runner image for the build cache
        id: image
        if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release-commit != 'true' && vars.RELEASE_BUILD_CACHE != 'off' && !inputs.clean-build }}
        shell: bash
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Install sccache 0.19.0 (SHA-256 verified)
        id: sccache-setup
        if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release-commit != 'true' && vars.RELEASE_BUILD_CACHE != 'off' && !inputs.clean-build }}
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: node tools/ci/compile-cache.mjs start --tools "$RUNNER_TEMP/sccache" --cache "$RUNNER_TEMP/compile-cache" --prefix "ree-release-sccache-v1-$RELEASE_OS-$TARGET-$IMAGE_NAME" --workflow .github/workflows/release.yml
      - name: Restore the build cache for vendored sources
        id: sccache-restore
        if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release-commit != 'true' && vars.RELEASE_BUILD_CACHE != 'off' && !inputs.clean-build && steps.sccache-setup.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.sccache-setup.outputs.key }}
          restore-keys: ree-release-sccache-v1-${{ matrix.os }}-${{ matrix.target }}-${{ steps.image.outputs.name }}-
          path: &sccache-cache-path ${{ runner.temp }}/compile-cache
      - name: Restore the compiled dependencies of an earlier run on main
        id: cache
        if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release-commit != 'true' && vars.RELEASE_BUILD_CACHE != 'off' && !inputs.clean-build && steps.sccache-setup.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ree-release-v1-${{ matrix.os }}-${{ matrix.target }}-${{ steps.image.outputs.name }}-1.90.0-cgu8-${{ needs.version.outputs.build-cache }}
          restore-keys: ree-release-v1-${{ matrix.os }}-${{ matrix.target }}-${{ steps.image.outputs.name }}-1.90.0-cgu8-
          path: &dep-cache-paths |
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
      - name: Build with public default features
        id: build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
        run: cargo build --release --locked --bin ree --target "$TARGET"
      # A bad static-CRT or mimalloc setup builds fine and then crashes at startup. Run it here so that fails the build
      # job, not only the smoke job after the zip is uploaded.
      - name: Check the built Windows executable starts
        if: ${{ matrix.os == 'windows' }}
        shell: bash
        run: '"target/$TARGET/release/$BINARY" --version'
      - name: Licenses and package (checks binary order, checksums and Unix modes)
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/licenses.mjs --target "$TARGET" --out "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
          node tools/release/package.mjs --binary "target/$TARGET/release/$BINARY" --version "$VERSION" --os "$RELEASE_OS" --arch "$ARCH" --licenses "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt" --out dist
      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ree-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Compile cache statistics
        if: ${{ !cancelled() && steps.sccache-setup.outcome == 'success' }}
        shell: bash
        run: node tools/ci/compile-cache.mjs stop
      # Saved last, only after a passing build on main whose cache key was not already stored.
      - name: Store the build cache for vendored sources
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.version.outputs.release-commit != 'true' && vars.RELEASE_BUILD_CACHE != 'off' && !inputs.clean-build && steps.sccache-restore.outcome == 'success' && steps.sccache-restore.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}
          path: *sccache-cache-path
      - name: Leave ree's own files out of the build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.version.outputs.release-commit != 'true' && vars.RELEASE_BUILD_CACHE != 'off' && !inputs.clean-build && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        shell: bash
        run: node tools/release/build-cache.mjs --prune target/release "target/$TARGET/release" --names roblox-engine-emulator,ree
      - name: Store the compiled dependencies for later runs on main
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.version.outputs.release-commit != 'true' && vars.RELEASE_BUILD_CACHE != 'off' && !inputs.clean-build && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: *dep-cache-paths

  smoke:
    if: ${{ !github.event.repository.private && needs.version.outputs.dry-run == '' && needs.version.outputs.nightly-build != 'false' }}
    needs: [version, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, os: windows, arch: x86_64 }
          - { runner: ubuntu-22.04, os: linux, arch: x86_64 }
          - { runner: macos-15, os: macos, arch: aarch64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The checkout goes into inputs/ for the smoke script and its harness. The binary is run from a temporary
      # folder. The smoke script puts an unrelated Cargo project above the binary there, which checkout detection
      # must ignore.
      - name: Check out the smoke script and its harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: inputs
      - name: Download the zip this platform built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ree-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets
      # Every platform runs an offline harness, a recording and the copied service. No GPU or Studio needed.
      # The smoke script extracts outside the workspace, redirects user caches, and checks input/output boundaries.
      - name: Run the installed executable outside any checkout
        shell: bash
        run: node inputs/tools/release/smoke.mjs --archive "$RUNNER_TEMP/release-assets/ree-$VERSION-$RELEASE_OS-$ARCH.zip" --version "$VERSION"

  notes:
    if: ${{ !github.event.repository.private && github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Notes from public commit subjects
        if: ${{ github.ref != 'refs/tags/canary' }}
        shell: bash
        run: node tools/release/notes.mjs --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/release-notes.md"
      # The commit, when its zips were built, and the commits since the latest version release
      - name: Canary notes
        if: ${{ github.ref == 'refs/tags/canary' }}
        shell: bash
        env:
          BUILT: ${{ needs.version.outputs.dry-run-date }}
        run: node tools/release/notes.mjs --canary "$GITHUB_SHA" --built "$BUILT" --out "$RUNNER_TEMP/release-notes.md"
      - name: Upload the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # Runs after this run's build and smoke passed, or, when they were skipped, on the dry run's zips.
  publish:
    if: ${{ !cancelled() && !github.event.repository.private && github.event_name == 'push' && github.ref_type == 'tag' && github.ref != 'refs/tags/canary' && needs.version.result == 'success' && needs.notes.result == 'success' && (needs.version.outputs.dry-run != '' || (needs.build.result == 'success' && needs.smoke.result == 'success')) }}
    needs: [version, build, smoke, notes]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read # to download the dry run's zips
    steps:
      # This job executes no repository code and does not check out the repository.
      - name: Say which run built the zips
        shell: bash
        env:
          DRY_RUN: ${{ needs.version.outputs.dry-run }}
        run: |
          if [ -n "$DRY_RUN" ]; then
            echo "Publishing the zips that dry run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN built and smoke-tested at $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing the zips this run built and smoke-tested" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the zips of every platform
        if: ${{ needs.version.outputs.dry-run == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ree-*
          path: assets
          merge-multiple: true
      - name: Download the zips the dry run of this commit built and smoke-tested
        if: ${{ needs.version.outputs.dry-run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ree-*
          path: assets
          merge-multiple: true
          run-id: ${{ needs.version.outputs.dry-run }}
          github-token: ${{ github.token }}
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: SHA-256 for every release asset
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum -- *.zip > SHA256SUMS
      - name: Attest the build provenance of the zips
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.zip
      # The tag already exists, mirrored from the private repository: this creates the release for it and no tag.
      - name: Publish the existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "ree $TAG" --notes-file notes/release-notes.md -R "$GITHUB_REPOSITORY" assets/*.zip assets/SHA256SUMS

  # The canary tag publishes the zips that the passing run at its commit built and smoke-tested, as the prerelease
  # "canary". The asset names stay the same from one build to the next, so a download link never changes. Like publish,
  # this job executes no repository code and alone may write.
  canary:
    if: ${{ !cancelled() && !github.event.repository.private && github.event_name == 'push' && github.ref == 'refs/tags/canary' && needs.version.result == 'success' && needs.notes.result == 'success' && needs.version.outputs.dry-run != '' }}
    needs: [version, notes]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read # to download the passing run's zips
    steps:
      # This job executes no repository code and does not check out the repository.
      - name: Download the zips the passing run of this commit built and smoke-tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ree-*
          path: assets
          merge-multiple: true
          run-id: ${{ needs.version.outputs.dry-run }}
          github-token: ${{ github.token }}
      - name: Download the canary notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # ree-<version>-<platform>.zip becomes ree-canary-<platform>.zip
      - name: Name the zips for the canary and take their SHA-256
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DRY_RUN: ${{ needs.version.outputs.dry-run }}
        run: |
          set -euo pipefail
          mkdir upload
          for platform in windows-x86_64 linux-x86_64 macos-aarch64; do
            mv "assets/ree-$VERSION-$platform.zip" "upload/ree-canary-$platform.zip"
          done
          cd upload
          sha256sum -- *.zip > SHA256SUMS
          echo "Publishing as canary the zips that run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN built and smoke-tested at $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Attest the build provenance of the canary zips
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: upload/*.zip
      # The tag already exists, moved by the export: this creates the release for it when there is none, else edits it,
      # and never creates or moves a tag. An existing release gets the new zips under the same names first, then loses
      # the assets that are no longer published, then its new title and notes.
      - name: Publish the canary prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          title="Canary (main ${GITHUB_SHA:0:10})"
          # A tag that has moved on since this run started has a newer run waiting in this group, which publishes it
          tagged=$(gh api "repos/$repo/git/ref/tags/canary" --jq .object.sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "canary has moved on to $tagged, whose own run publishes it" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view canary -R "$repo" --json id > /dev/null 2> view.err; then
            gh release upload canary upload/* --clobber -R "$repo"
            gh release view canary -R "$repo" --json assets --jq '.assets[].name' > published.txt
            while IFS= read -r asset; do
              if [ ! -e "upload/$asset" ]; then gh release delete-asset canary "$asset" --yes -R "$repo"; fi
            done < published.txt
            gh release edit canary --title "$title" --notes-file notes/release-notes.md --prerelease --latest=false -R "$repo"
          elif grep -q "release not found" view.err; then
            gh release create canary --verify-tag --title "$title" --notes-file notes/release-notes.md --prerelease --latest=false -R "$repo" upload/*
          else
            cat view.err >&2
            exit 1
          fi
